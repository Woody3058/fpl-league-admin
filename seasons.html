
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        FPL Admin - Seasons
    </title>

    <link
        rel="stylesheet"
        href="css/admin.css"
    >

</head>


<body>


<header class="admin-header">

    <h1>
        FPL League Admin
    </h1>

    <button
        id="logoutButton"
        type="button"
    >
        Logout
    </button>

</header>


<nav class="admin-navigation">

    <a
        href="scores.html"
        id="scoresNavLink"
    >
        Scores
    </a>

    <a
        href="players.html"
        id="playersNavLink"
    >
        Players
    </a>

    <a
        href="seasons.html"
        id="seasonsNavLink"
    >
        Seasons
    </a>

</nav>


<main class="admin-main">


    <section class="admin-panel">

        <div class="admin-panel-header">

            <h2>
                Season Management
            </h2>

        </div>


        <!-- ==================================
             CREATE SEASON
             ================================== -->

        <section class="season-create-section">

            <h3>
                Create New Season
            </h3>


            <div class="form-row">

                <label for="seasonCode">
                    Season Code
                </label>

                <input
                    type="text"
                    id="seasonCode"
                    placeholder="27/28"
                >

            </div>


            <div class="form-row">

                <label for="seasonName">
                    Season Name
                </label>

                <input
                    type="text"
                    id="seasonName"
                    placeholder="2027/28"
                >

            </div>


            <div class="form-row">

                <label for="totalGameweeks">
                    Total Gameweeks
                </label>

                <input
                    type="number"
                    id="totalGameweeks"
                    value="38"
                    min="1"
                    max="50"
                >

            </div>


            <div class="form-row">

                <label for="currentGameweek">
                    Starting Gameweek
                </label>

                <input
                    type="number"
                    id="currentGameweek"
                    value="0"
                    min="0"
                    max="50"
                >

            </div>


            <button
                id="createSeasonButton"
                type="button"
            >
                Create Season
            </button>

            <a
                href="historical-import.html"
                class="admin-action-link"
            >
                Import Historical Scores
            </a>


            <div
                id="seasonCreateMessage"
            >
            </div>

        </section>


        <!-- ==================================
             SEASON TABLE
             ================================== -->

        <section>

            <h3>
                Existing Seasons
            </h3>


            <div class="table-container">

                <table
                    id="seasonManagementTable"
                >

                    <thead>

                        <tr>

                            <th>
                                Season
                            </th>

                            <th>
                                Code
                            </th>

                            <th>
                                Gameweeks
                            </th>

                            <th>
                                Current GW
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody>
                    </tbody>

                </table>

            </div>

        </section>


    </section>


</main>


<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="js/supabase.js"></script>

<script src="js/admin-common.js"></script>

<script src="js/admin-data.js"></script>

<script src="js/seasons.js"></script>


</body>

</html>
