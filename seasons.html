
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        FA Cuck FPL Admin - Seasons
    </title>

    <link
        rel="stylesheet"
        href="css/admin.css"
    >
</head>

<body>

<header class="admin-header">

    <h1>FA Cuck FPL League Admin</h1>

    <button
        id="logoutButton"
        type="button"
    >
        Logout
    </button>

</header>

<nav class="admin-navigation">

    <a
        href="scores.html"
        id="scoresNavLink"
    >
        Scores
    </a>

    <a
        href="chips.html"
        id="chipsNavLink"
    >
        Chips
    </a>

    <a
        href="players.html"
        id="playersNavLink"
    >
        Players
    </a>

    <a
        href="seasons.html"
        id="seasonsNavLink"
    >
        Seasons
    </a>

    <a
        href="prizes.html"
        id="prizesNavLink"
    >
        Prize Settings
    </a>

</nav>

<main class="admin-main">

    <section class="admin-panel">

        <div class="admin-panel-header">

            <h2>Season Management</h2>

        </div>

        <section class="season-create-section">

            <h3>Create New Season</h3>

            <div class="form-row">

                <label for="seasonCode">
                    Season Code
                </label>

                <input
                    type="text"
                    id="seasonCode"
                    placeholder="27/28"
                >

            </div>

            <div class="form-row">

                <label for="seasonName">
                    Season Name
                </label>

                <input
                    type="text"
                    id="seasonName"
                    placeholder="2027/28"
                >

            </div>

            <div class="form-row">

                <label for="totalGameweeks">
                    Total Gameweeks
                </label>

                <input
                    type="number"
                    id="totalGameweeks"
                    value="38"
                    min="1"
                    max="50"
                >

            </div>

            <div class="form-row">

                <label for="currentGameweek">
                    Starting Gameweek
                </label>

                <input
                    type="number"
                    id="currentGameweek"
                    value="0"
                    min="0"
                    max="50"
                >

            </div>

            <div class="season-controls">
                <button
                    id="createSeasonButton"
                    type="button"
                >
                    Create Season
                </button>

                <button
                    type="button"
                >
                    <a
                        class="season-action-link"
                        href="historical-import.html"
                        
                    >
                    Import Historical Scores
                    </a>
                </button>
            </div>

            <div
                id="seasonCreateMessage"
            >
            </div>

        </section>

        <section>

            <h3>Existing Seasons</h3>

            <div class="table-container">

                <table id="seasonManagementTable">
                    <thead>
                        <tr>
                            <th>
                                Season
                            </th>

                            <th>
                                Code
                            </th>

                            <th>
                                Gameweeks
                            </th>

                            <th>
                                Current GW
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Actions
                            </th>
                        </tr>
                    </thead>

                    <tbody>
                    </tbody>
                </table>

            </div>

        </section>

    </section>

</main>

    <!--==================================
        SCRIPTS
        ================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js?v=1.2"></script>
    <script src="js/admin-common.js?v=1.2"></script>
    <script src="js/admin-data.js?v=1.2"></script>
    <script src="js/seasons.js?v=1.2"></script>

</body>

</html>
