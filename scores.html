
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        FA Cuck FPL Admin - Scores
    </title>

    <link
        rel="stylesheet"
        href="css/admin.css?v=1.2"
    >
</head>

<body>

<header class="admin-header">

    <h1>FA Cuck FPL League Admin</h1>

    <button
        id="logoutButton"
        type="button"
    >
        Logout
    </button>

</header>

<nav class="admin-navigation">

    <a
        href="scores.html"
        id="scoresNavLink"
    >
        Scores
    </a>

    <a
        href="chips.html"
        id="chipsNavLink"
    >
        Chips
    </a>

    <a
        href="players.html"
        id="playersNavLink"
    >
        Players
    </a>

    <a
        href="seasons.html"
        id="seasonsNavLink"
    >
        Seasons
    </a>

    <a
        href="prizes.html"
        id="prizesNavLink"
    >
        Prize Settings
    </a>

</nav>

<main class="admin-main">

    <section class="admin-panel">

        <div class="admin-panel-header">

            <h2>
                Gameweek Scores - <span id="scoreSeasonName"></span>
            </h2>

            <div class="score-controls">

                <label
                    for="gameweekSelector"
                >
                    Gameweek:
                </label>

                <select
                    id="gameweekSelector"
                >
                </select>

                <button
                    id="importFplButton"
                    type="button"
                >
                    Import Season Scores
                </button>

                <button
                    id="importCaptainDataButton"
                    type="button"
                >
                    Update Captains for GW
                </button>

            </div>

        </div>

        <div class="import-timestamps">

            <div>
                Scores last updated:
                <strong id="scoresLastImported">
                    Never
                </strong>
            </div>

            <div>
                Captains last updated:
                <strong id="captainsLastImported">
                    Never
                </strong>
            </div>

        </div>

        <div
            id="gameweekDataStatus"
            class="gameweek-data-status"
        >

            <div class="gameweek-data-status-item">

                <span>
                    Scores
                </span>

                <strong id="gameweekScoreStatus">
                    —
                </strong>

            </div>

            <div class="gameweek-data-status-item">

                <span>
                    Captains
                </span>

                <strong id="gameweekCaptainStatus">
                    —
                </strong>

                <small
                    id="gameweekCaptainMissing"
                    class="gameweek-data-status-detail"
                >
                </small>

            </div>

            <div class="gameweek-data-status-item">

                <span>
                    Chips Used
                </span>

                <strong id="gameweekChipStatus">
                    —
                </strong>

            </div>

        </div>

        <div
            id="fplImportStatus"
            class="fpl-import-status"
            style="display:none;"
        >

            <h3 id="fplImportStatusTitle">FPL Import Status</h3>

            <div
                id="fplImportSummary"
            >
            </div>

            <div
                id="fplImportPlayers"
            >
            </div>

        </div>

        <div class="table-container">
            <table id="scoreManagementTable">
                <thead>
                    <tr>
                        <th>Player</th>
                        <th>Points</th>
                        <th>Adjustment</th>
                        <th>Points Adjusted</th>
                        <th>Note</th>
                        <th></th>
                    </tr>
                </thead>

                <tbody>
                </tbody>
            </table>
        </div>

    </section>

</main>

    <!--==================================
        SCRIPTS
        ================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js?v=1.2"></script>
    <script src="js/admin-common.js?v=1.2"></script>
    <script src="js/admin-data.js?v=1.2"></script>
    <script src="js/scores.js?v=1.2"></script>

</body>

</html>
