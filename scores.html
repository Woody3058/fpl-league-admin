
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        FA Cuck FPL Admin - Scores
    </title>

    <link
        rel="stylesheet"
        href="css/admin.css"
    >

</head>


<body>


<header class="admin-header">

    <h1>
        FA Cuck FPL League Admin
    </h1>

    <button
        id="logoutButton"
        type="button"
    >
        Logout
    </button>

</header>


<nav class="admin-navigation">

    <a
        href="scores.html"
        id="scoresNavLink"
    >
        Scores
    </a>

    <a
        href="players.html"
        id="playersNavLink"
    >
        Players
    </a>

    <a
        href="seasons.html"
        id="seasonsNavLink"
    >
        Seasons
    </a>

</nav>


<main class="admin-main">


    <section class="admin-panel">

        <div class="admin-panel-header">

            <h2>
                Gameweek Scores -
                <span id="scoreSeasonName"></span>
            </h2>


            <div class="score-controls">

                <label
                    for="gameweekSelector"
                >
                    Gameweek:
                </label>


                <select
                    id="gameweekSelector"
                >
                </select>


                <button
                    id="importFplButton"
                    type="button"
                >
                    Import FPL Scores
                </button>

            </div>

        </div>


        <div
            id="fplImportStatus"
            class="fpl-import-status"
            style="display:none;"
        >

            <h3>
                FPL Import Status
            </h3>

            <div
                id="fplImportSummary"
            >
            </div>

            <div
                id="fplImportPlayers"
            >
            </div>

        </div>


        <div class="table-container">

            <table
                id="scoreManagementTable"
            >

                <thead>

                    <tr>

                        <th>Player</th>
                        <th>FPL</th>
                        <th>Adjustment</th>
                        <th>Total</th>
                        <th>Note</th>
                        <th></th>

                    </tr>

                </thead>


                <tbody>
                </tbody>

            </table>

        </div>

    </section>


</main>


<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="js/supabase.js"></script>

<script src="js/admin-common.js"></script>

<script src="js/admin-data.js"></script>

<script src="js/scores.js"></script>


</body>

</html>
