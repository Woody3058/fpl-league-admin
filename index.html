
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        FA Cuck FPL Admin Login
    </title>

    <link
        rel="stylesheet"
        href="css/admin.css?v=1.2"
    >

</head>


<body>


<main class="admin-login-page">

    <section class="admin-login-panel">

        <div class="admin-login-brand">

            <h1>
                FA Cuck FPL League Admin
            </h1>

            <p>
                Sign in to manage scores, players and seasons.
            </p>

        </div>


        <form id="loginForm">

            <div class="form-row">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-row">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Sign In
            </button>


            <div
                id="loginError"
                class="error"
            >
            </div>

        </form>


        <div class="admin-login-footer">

        <a href="https://woody3058.github.io/fpl-league/">
            Back to Public Site
        </a>

        </div>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=1.2"></script>
<script src="js/login.js?v=1.2"></script>

</body>

</html>
